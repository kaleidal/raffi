**Watching**

- Hardware-accelerated playback with audio and subtitle track selection
- Seek bar previews, intro skipping and subtitle delay adjustment
- Local files, and torrents through [Limbo](https://limbo.kaleid.al)

**Keeping track**

- Continue watching with progress for every episode
- Your own lists and collections
- Progress, lists and addons that sync with your account

**Watching together**

- Watch parties with synced playback, chat and host controls
- Discord presence that shows what you're watching
"""
