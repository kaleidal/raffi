  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raffi</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' __RAFFI_DEV_EVAL__;
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https: http: raffi-media:;
    connect-src 'self' data: blob: https: http: ws: wss: raffi-media: raffi-transcode:;
    font-src 'self' data:;
    media-src 'self' data: blob: https: http: raffi-media: raffi-transcode:;
    frame-src https: http:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
</head>

  <div id="app"></div>

</html>
