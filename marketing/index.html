<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/raffi.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raffi</title>
    <meta name="description" content="Raffi turns the Stremio addons you already use into one library, with a fast player, watch parties and Trakt." />
    <script>
      try {
        const theme = localStorage.getItem("raffi-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
